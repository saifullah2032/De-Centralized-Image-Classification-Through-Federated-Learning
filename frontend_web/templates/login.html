{% extends "base.html" %}

{% block title %}Login - Federated Learning{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-lg-5 col-md-7">
        <!-- Logo & Title -->
        <div class="text-center mb-5">
            <div class="mb-4">
                <i class="fas fa-network-wired" style="font-size: 4rem; color: var(--accent-cyan);"></i>
            </div>
            <h1 class="mb-2">Access Network</h1>
            <p class="text-secondary">Enterprise Federated Intelligence Portal</p>
        </div>

        <!-- Login Card -->
        <div class="card mb-4">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <!-- Username Field -->
                    <div class="mb-4">
                        <label for="username" class="form-label small text-uppercase fw-bold">Username</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="admin"
                            required 
                            autofocus
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="password" class="form-label small text-uppercase fw-bold">Access Key</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">
                        <i class="fas fa-key me-2"></i> Authenticate
                    </button>

                    <!-- Demo Credentials -->
                    <div class="p-3 rounded mb-4" style="background: var(--bg-tertiary); border: 2px solid var(--border-color);">
                        <div class="text-center small fw-bold mb-3">Demo Access</div>
                        <div class="row g-2">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-primary w-100 py-2" onclick="setCredentials('admin', 'admin123')">
                                    <i class="fas fa-shield-alt me-1"></i> Admin
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-primary w-100 py-2" onclick="setCredentials('client', 'client123')">
                                    <i class="fas fa-microchip me-1"></i> Client
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <span class="text-muted small">Unauthorized access is logged.</span>
                    </div>
                </form>
            </div>
        </div>

        <!-- Register Link -->
        <div class="text-center">
            <p class="text-secondary small">
                New node? 
                <a href="{{ url_for('register') }}" class="fw-bold" style="color: var(--primary);">
                    Register Entity
                </a>
            </p>
        </div>
    </div>
</div>

<style>
    .fw-black { font-weight: 900; }
</style>

<script>
    function setCredentials(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
        document.querySelector('form').submit();
    }
</script>
{% endblock %}
