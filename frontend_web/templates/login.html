{% extends "base.html" %}

{% block title %}Login - Federated Learning{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-lg-5 col-md-7">
        <!-- Logo & Title -->
        <div class="text-center mb-5">
            <div class="mb-4">
                <i class="fas fa-network-wired text-primary fa-4x shadow-glow pulse"></i>
            </div>
            <h1 class="display-5 fw-black mb-2">Access Network</h1>
            <p class="text-secondary">Enterprise Federated Intelligence Portal</p>
        </div>

        <!-- Login Card -->
        <div class="card bg-dark-2 border-color mb-4">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <!-- Username Field -->
                    <div class="mb-4">
                        <label for="username" class="form-label small text-uppercase fw-bold text-tertiary">Username</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="admin"
                            required 
                            autofocus
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="password" class="form-label small text-uppercase fw-bold text-tertiary">Access Key</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">
                        <i class="fas fa-key me-2"></i> Authenticate
                    </button>

                    <!-- Demo Credentials -->
                    <div class="p-3 bg-black rounded-xl border border-color mb-4">
                        <div class="text-center small text-tertiary mb-3 text-uppercase fw-bold">Demo Access</div>
                        <div class="row g-2">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-secondary w-100 py-2 small" onclick="setCredentials('admin', 'admin123')">
                                    <i class="fas fa-shield-halved me-1"></i> Admin
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-secondary w-100 py-2 small" onclick="setCredentials('client', 'client123')">
                                    <i class="fas fa-microchip me-1"></i> Client
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <span class="text-secondary small">Unauthorized access is logged.</span>
                    </div>
                </form>
            </div>
        </div>

        <!-- Register Link -->
        <div class="text-center">
            <p class="text-secondary small">
                New node? 
                <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">
                    Register Entity
                </a>
            </p>
        </div>
    </div>
</div>

<style>
    .fw-black { font-weight: 900; }
    .bg-dark-2 { background: var(--dark-2); }
    .shadow-glow { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
    .border-color { border-color: var(--border-color) !important; }
</style>

<script>
    function setCredentials(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
        document.querySelector('form').submit();
    }
</script>
{% endblock %}
