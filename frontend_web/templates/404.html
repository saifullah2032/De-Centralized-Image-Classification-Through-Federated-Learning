<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Network Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    <style>
        body {
            background: var(--dark-1);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .error-code {
            font-size: 10rem;
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="mb-4">
            <i class="fas fa-network-wired text-primary fa-4x opacity-50"></i>
        </div>
        <div class="error-code">404</div>
        <h2 class="fw-bold mb-4">Node Not Found</h2>
        <p class="text-secondary lead mb-5">The requested coordination endpoint does not exist in the current network architecture.</p>
        <a href="/" class="btn btn-primary btn-lg px-5">
            <i class="fas fa-home me-2"></i> Return to Command Center
        </a>
    </div>
</body>
</html>
