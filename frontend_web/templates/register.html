{% extends "base.html" %}

{% block title %}Register - Federated Learning{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-lg-5 col-md-7">
        <!-- Logo & Title -->
        <div class="text-center mb-5">
            <div class="mb-4">
                <i class="fas fa-user-plus text-primary fa-4x shadow-glow pulse"></i>
            </div>
            <h1 class="display-5 fw-bold mb-2">Initialize Node</h1>
            <p class="text-secondary">Register a new computational entity in the network</p>
        </div>

        <!-- Registration Card -->
        <div class="card bg-dark-2 border-color mb-4">
            <div class="card-body p-4">
                <form method="POST">
                    <!-- Username Field -->
                    <div class="mb-4">
                        <label for="username" class="form-label small text-uppercase fw-bold text-tertiary">Entity Identifier</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="Choose a unique ID"
                            minlength="3"
                            required 
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="password" class="form-label small text-uppercase fw-bold text-tertiary">Secure Key</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            minlength="6"
                            required
                        >
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label small text-uppercase fw-bold text-tertiary">Verify Key</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password_confirm" 
                            name="password_confirm" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-5">
                        <label class="form-label small text-uppercase fw-bold text-tertiary">Node Protocol</label>
                        <div class="row g-3">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="role_client" value="client" checked>
                                <label class="btn btn-outline-secondary w-100 py-3" for="role_client">
                                    <i class="fas fa-microchip mb-2 d-block fs-4"></i>
                                    <span class="smaller fw-bold">CLIENT</span>
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="role_admin" value="admin">
                                <label class="btn btn-outline-secondary w-100 py-3" for="role_admin">
                                    <i class="fas fa-shield-halved mb-2 d-block fs-4"></i>
                                    <span class="smaller fw-bold">ADMIN</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">
                        <i class="fas fa-plus-circle me-2"></i> Provision Node
                    </button>

                    <div class="text-center">
                        <p class="text-secondary small">
                            Existing entity? 
                            <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">
                                Authenticate
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-dark-2 { background: var(--dark-2) !important; }
    .shadow-glow { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
    .border-color { border-color: var(--border-color) !important; }
    .smaller { font-size: 0.75rem; }
    .btn-outline-secondary {
        border-color: var(--border-color);
        color: var(--text-tertiary);
    }
    .btn-check:checked + .btn-outline-secondary {
        background: rgba(99, 102, 241, 0.1) !important;
        border-color: var(--primary-500) !important;
        color: var(--primary-500) !important;
    }
</style>
{% endblock %}
