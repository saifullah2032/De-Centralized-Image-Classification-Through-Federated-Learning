{% extends "base.html" %}

{% block title %}Register - Federated Learning{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-lg-5 col-md-7">
        <!-- Logo & Title -->
        <div class="text-center mb-5">
            <div class="mb-4">
                <i class="fas fa-user-plus" style="font-size: 4rem; color: var(--accent-cyan);"></i>
            </div>
            <h1 class="mb-2">Initialize Node</h1>
            <p class="text-secondary">Register a new computational entity in the network</p>
        </div>

        <!-- Registration Card -->
        <div class="card mb-4">
            <div class="card-body p-4">
                <form method="POST">
                    <!-- Username Field -->
                    <div class="mb-4">
                        <label for="username" class="form-label small text-uppercase fw-bold">Entity Identifier</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="Choose a unique ID"
                            minlength="3"
                            required 
                        >
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="password" class="form-label small text-uppercase fw-bold">Secure Key</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            minlength="6"
                            required
                        >
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label small text-uppercase fw-bold">Verify Key</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password_confirm" 
                            name="password_confirm" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-5">
                        <label class="form-label small text-uppercase fw-bold">Node Protocol</label>
                        <div class="row g-3">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="role_client" value="client" checked>
                                <label class="btn w-100 py-3" for="role_client" style="border: 3px solid var(--border-color); background: var(--bg-tertiary);">
                                    <i class="fas fa-microchip mb-2 d-block" style="font-size: 1.5rem;"></i>
                                    <span class="fw-bold">CLIENT</span>
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="role_admin" value="admin">
                                <label class="btn w-100 py-3" for="role_admin" style="border: 3px solid var(--border-color); background: var(--bg-tertiary);">
                                    <i class="fas fa-shield-alt mb-2 d-block" style="font-size: 1.5rem;"></i>
                                    <span class="fw-bold">ADMIN</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-4">
                        <i class="fas fa-plus-circle me-2"></i> Provision Node
                    </button>

                    <div class="text-center">
                        <p class="text-secondary small">
                            Existing entity? 
                            <a href="{{ url_for('login') }}" class="fw-bold" style="color: var(--primary);">
                                Authenticate
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-check:checked + label {
        background: var(--primary) !important;
        color: white !important;
    }
</style>
{% endblock %}
