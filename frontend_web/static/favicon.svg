<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Network nodes (federated learning representation) -->
  <circle cx="50" cy="30" r="6" fill="#ffffff"/>
  <circle cx="30" cy="55" r="6" fill="#ffffff"/>
  <circle cx="70" cy="55" r="6" fill="#ffffff"/>
  <circle cx="50" cy="75" r="8" fill="#ffffff"/>
  
  <!-- Connecting lines -->
  <line x1="50" y1="30" x2="30" y2="55" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="50" y1="30" x2="70" y2="55" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="30" y1="55" x2="50" y2="75" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="70" y1="55" x2="50" y2="75" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <!-- Center glow -->
  <circle cx="50" cy="75" r="8" fill="#8b5cf6" opacity="0.3"/>
</svg>
